id: soggy-pools-aio
category: bitcoin
name: Soggy Pools AIO
version: "0.1.12"
tagline: Five solo mining nodes, one dashboard
description: >-
  Run Bitcoin, Bitcoin Cash, eCash, DigiByte SHA-256d and Bitcoin Cash II nodes and solo pools.
  Enable only the coins you want, with independent pruning targets from 550 MiB.
  Includes a dashboard, worker statistics, payout settings and node/pool logs.
  Block rewards go to the address configured per coin. No pool fee; eCash
  consensus-required miner fund and staking outputs still apply.
  Initial beta: validate on your Umbrel before committing substantial hashrate.
