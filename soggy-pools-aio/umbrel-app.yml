releaseNotes: "Overview network hashrate and compact network difficulty for all five coins, SHA-256d-specific DigiByte metrics, and a separate eCash RTT difficulty snapshot. Background polling with age/stale indicators does not block mining supervision. Ports remain 3330-3334; saved settings and chain data are preserved."
